<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <header class="toolbar">
            <button id="previousMonthButton" type="button" aria-label="이전 달">&laquo;</button>
            <h1 id="currentMonthLabel">&nbsp;</h1>
            <button id="nextMonthButton" type="button" aria-label="다음 달">&raquo;</button>
            <button id="todayButton" type="button">오늘</button>
            <div class="toolbar-spacer"></div>
            <button id="manageGroupsButton" type="button">그룹</button>
            <button id="weekStartToggleButton" type="button" title="주 시작 요일 전환">주 시작: 일</button>
        </header>
        <div id="filterBar" class="filter-bar"></div>
        <div id="weekdayRow" class="weekday-row"></div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <div id="eventDialogBackdrop" class="dialog-backdrop hidden">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="eventDialogTitle">
            <h2 id="eventDialogTitle">일정</h2>
            <label class="field">
                <span>날짜</span>
                <input id="eventDateInput" type="date">
            </label>
            <label class="field checkbox-field">
                <input id="eventAllDayInput" type="checkbox">
                <span>종일</span>
            </label>
            <div class="time-row">
                <label class="field">
                    <span>시작 시간</span>
                    <input id="eventStartTimeInput" type="time" step="60">
                </label>
                <label class="field">
                    <span>종료 시간</span>
                    <input id="eventEndTimeInput" type="time" step="60">
                </label>
            </div>
            <label class="field">
                <span>그룹</span>
                <select id="eventGroupSelect"></select>
            </label>
            <label class="field">
                <span>제목</span>
                <input id="eventTitleInput" type="text" maxlength="200" placeholder="일정 제목을 입력하세요">
            </label>
            <div class="dialog-actions">
                <button id="eventDeleteButton" type="button" class="danger hidden">삭제</button>
                <div class="spacer"></div>
                <button id="eventCancelButton" type="button">취소</button>
                <button id="eventSaveButton" type="button" class="primary">저장</button>
            </div>
        </div>
    </div>

    <div id="groupDialogBackdrop" class="dialog-backdrop hidden">
        <div class="dialog group-dialog" role="dialog" aria-modal="true" aria-labelledby="groupDialogTitle">
            <h2 id="groupDialogTitle">그룹 관리</h2>
            <div id="groupListContainer" class="group-list"></div>
            <div class="group-form">
                <label class="field">
                    <span>새 그룹 이름</span>
                    <input id="newGroupNameInput" type="text" maxlength="50" placeholder="예: 개인, 업무">
                </label>
                <label class="field">
                    <span>색상</span>
                    <input id="newGroupColorInput" type="color" value="#2f6fed">
                </label>
                <button id="addGroupButton" type="button" class="primary">추가</button>
            </div>
            <div class="dialog-actions">
                <div class="spacer"></div>
                <button id="groupDialogCloseButton" type="button">닫기</button>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
